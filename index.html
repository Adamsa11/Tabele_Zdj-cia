    <script>
      (function() {
        try {
          var _fetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(newFetch) {
                _fetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
